name: Sondar lojas
on:
  push:
    branches: [sondar-lojas]
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="NovosDiscosBot/1.0 (+https://jorgevasco-ui.github.io/novos-discos/)"
          echo "=== HARDWAX RSS"; curl -sL -m 20 -A "$UA" https://hardwax.com/feeds/news.rss -o /tmp/hw.xml -w "HTTP %{http_code} %{size_download}b\n"
          grep -c "<item>" /tmp/hw.xml; head -c 3500 /tmp/hw.xml; echo
          grep -oE "<pubDate>[^<]*" /tmp/hw.xml | sort | uniq -c | head -20
          grep -oE "<category>[^<]*" /tmp/hw.xml | sort | uniq -c | sort -rn | head -30
          echo "=== DECKS list"; curl -sL -m 20 -A "$UA" "https://www.decks.de/decks/workfloor/lists/list_db.php?wo=mgn&now_Sub=mt&now_Was=news&now_Date=nodate&aktuell=0" -o /tmp/d.html -w "HTTP %{http_code} %{size_download}b\n"
          grep -oiE '<title>[^<]*' /tmp/d.html; sed 's/<[^>]*>/ /g' /tmp/d.html | tr -s ' \t' ' ' | grep -v '^ *$' | sed -n '60,140p' | cut -c1-160
          echo "=== DECKS home genres"; curl -sL -m 20 -A "$UA" https://www.decks.de/ | grep -oE 'now_Sub=[a-z]+[^>]*>[^<]{2,40}' | sort -u | head -40
