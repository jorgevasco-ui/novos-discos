name: Sondar lojas
on:
  push:
    branches: [sondar-lojas]
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="NovosDiscosBot/1.0 (+https://jorgevasco-ui.github.io/novos-discos/)"
          curl -sL -m 20 -A "$UA" https://www.decks.de/ | iconv -f latin1 -t utf-8 > /tmp/h.html
          grep -oE 'href="[^"]*"[^>]*>[^<]{2,40}' /tmp/h.html | sed -E 's/^href="([^"]*)"[^>]*>(.*)/OUT \2 => \1/' | grep -iE "techno|house|dub|drum|minimal|ambient|electro|news|genre" | sort -u | head -60
          grep -oiE '[^"]{0,120}(techno|drum ?& ?bass|dubstep)[^"]{0,60}' /tmp/h.html | sed 's/^/OUT2 /' | head -20
