name: Sondar lojas
on:
  push:
    branches: [sondar-lojas]
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="NovosDiscosBot/1.0 (+https://jorgevasco-ui.github.io/novos-discos/)"
          curl -sL -m 20 -A "$UA" https://bandcamp.com/robots.txt | sed 's/^/OUT R /' | head -60
          curl -sL -m 20 -A "$UA" -o /tmp/t -w "OUT terms %{http_code}\n" https://bandcamp.com/terms_of_use
          sed 's/<[^>]*>/ /g' /tmp/t | tr -s ' \n' ' ' | grep -oiE '.{0,200}(robot|spider|scrap|crawl|automated).{0,200}' | head -6 | sed 's/^/OUT T /'
          curl -sL -m 20 -A "$UA" -o /tmp/d -w "OUT discover %{http_code} %{content_type}\n" "https://bandcamp.com/discover/dub-techno"
