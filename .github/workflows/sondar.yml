name: Sondar lojas
on:
  push:
    branches: [sondar-lojas]
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="NovosDiscosBot/1.0 (+https://jorgevasco-ui.github.io/novos-discos/)"
          for c in te tk tc ho hs dh dn db ds du dt dp mi mn am ab el ec bs br ex cd; do
            curl -sL -m 20 -A "$UA" "https://www.decks.de/decks/workfloor/lists/list_db.php?wo=mgn&now_Sub=$c&now_Was=news&now_Date=lw" -o /tmp/d.html
            t=$(grep -oiE '<title>[^<]*' /tmp/d.html | head -1); n=$(grep -c 'class="LArtist' /tmp/d.html)
            styles=$(iconv -f latin1 -t utf-8 /tmp/d.html | grep -oE 'class="LStyle"><a[^>]*>[^<]*' | sed 's/.*>//' | sort | uniq -c | sort -rn | head -6 | tr -s ' \n' ' ')
            echo "$c | $t | $n items | $styles"
          done
          curl -sL -m 20 -A "$UA" "https://www.hhv.de/en/catalog/filter/new-releases" -o /tmp/h.html -w "HHV new-releases HTTP %{http_code} %{size_download}b\n"; head -c 300 /tmp/h.html; echo
