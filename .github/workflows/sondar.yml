name: Sondar lojas
on:
  push:
    branches: [sondar-lojas]
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="NovosDiscosBot/1.0 (+https://jorgevasco-ui.github.io/novos-discos/)"
          curl -sL -m 20 -A "$UA" https://www.decks.de/ | iconv -f latin1 -t utf-8 | grep -oE 'href="[^"]*list[^"]*"[^>]*>[^<]{2,40}' | sed -E 's/"[^>]*>/" => /' | sort -u | head -120
