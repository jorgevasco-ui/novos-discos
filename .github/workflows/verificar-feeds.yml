name: Verificar feeds
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Endereços dos feeds, separados por espaços"
        required: true
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/verificar-feeds.mjs ${{ inputs.urls }}
